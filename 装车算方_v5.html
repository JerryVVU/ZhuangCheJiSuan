<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>装车算方工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; background: #e8f0fe; padding-bottom: 80px; }
.header { background: linear-gradient(135deg, #1976D2, #42A5F5); color: white; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(25,118,210,.3); }
.header h1 { font-size: 20px; margin-bottom: 4px; }
.header .total { font-size: 28px; font-weight: bold; }
.header .sub { font-size: 13px; opacity: .9; }
.search-bar { padding: 10px 12px; background: white; border-bottom: 1px solid #ddd; position: sticky; top: 70px; z-index: 99; }
.search-bar input { width: 100%; padding: 10px 14px; border: 1.5px solid #42A5F5; border-radius: 22px; font-size: 15px; outline: none; }
.group { margin: 8px 0; background: white; border-radius: 10px; overflow: hidden; }
.group-header { padding: 10px 14px; background: #e3f2fd; font-weight: bold; font-size: 14px; color: #1565C0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.group-header .arrow { transition: transform .2s; }
.group-header.collapsed .arrow { transform: rotate(-90deg); }
.item { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
.item:last-child { border-bottom: none; }
.item .name { flex: 1; font-size: 14px; line-height: 1.3; }
.item .name .size { font-size: 11px; color: #999; }
.item .ctrl { display: flex; align-items: center; gap: 6px; }
.item .ctrl button { width: 36px; height: 36px; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.item .ctrl .minus { background: #ffe0e0; color: #d00; }
.item .ctrl .plus { background: #bbdefb; color: #1565C0; }
.item .ctrl input { width: 52px; height: 34px; text-align: center; border: 1.5px solid #bbdefb; border-radius: 6px; font-size: 15px; }
.item .vol { font-size: 11px; color: #888; min-width: 60px; text-align: right; }
.item .vol .single { color: #42A5F5; font-weight: bold; }
.item .vol .totalv { color: #888; }
.truck-section { margin: 10px 12px; background: white; border-radius: 10px; padding: 14px; }
.truck-section h3 { font-size: 15px; margin-bottom: 8px; color: #1565C0; }
.truck-inputs { display: flex; gap: 8px; margin-bottom: 8px; }
.truck-inputs input { flex: 1; padding: 10px; border: 1.5px solid #bbdefb; border-radius: 8px; font-size: 14px; }
.progress-bar { height: 22px; background: #e3f2fd; border-radius: 11px; overflow: hidden; margin: 8px 0; position: relative; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #1976D2, #42A5F5); border-radius: 11px; transition: width .3s; }
.progress-bar .label { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 12px; font-weight: bold; color: #1565C0; }
.truck-result { font-size: 13px; color: #555; }
.btn-row { display: flex; gap: 8px; margin: 10px 12px; }
.btn-row button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
.btn-copy { background: #1976D2; color: white; }
.btn-reset { background: #cfd8dc; color: #37474f; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(25,118,210,.92); color: white; padding: 14px 28px; border-radius: 10px; font-size: 15px; z-index: 999; display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>📦 装车算方工具</h1>
  <div class="total" id="totalVol">0.0000 方</div>
  <div class="sub" id="totalBox">共 0 箱</div>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="🔍 搜索箱型名称..." oninput="filterItems()">
</div>

<div id="groups"></div>

<div class="truck-section">
  <h3>🚛 车厢尺寸（米）</h3>
  <div class="truck-inputs">
    <input type="number" id="tL" placeholder="长(m)" step="0.1" oninput="calcTruck()">
    <input type="number" id="tW" placeholder="宽(m)" step="0.1" oninput="calcTruck()">
    <input type="number" id="tH" placeholder="高(m)" step="0.1" oninput="calcTruck()">
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progFill" style="width:0%"></div>
    <div class="label" id="progLabel">0%</div>
  </div>
  <div class="truck-result" id="truckResult"></div>
</div>

<div class="btn-row">
  <button class="btn-copy" onclick="exportSummary()">📋 复制装车汇总</button>
  <button class="btn-reset" onclick="resetAll()">🗑 全部清零</button>
</div>

<div class="toast" id="toast"></div>

<script>
const boxes = [
  { group: "常规系列", name: "大橙箱", l:42, w:31, h:17.5 },
  { group: "常规系列", name: "大蓝箱", l:42, w:31, h:17.5 },
  { group: "常规系列", name: "小绿箱", l:39.5, w:27, h:16 },
  { group: "常规系列", name: "小紫箱", l:39.5, w:27, h:16 },
  { group: "常规系列", name: "小橙箱", l:34, w:25.5, h:16.5 },
  { group: "煮面/烟火系列", name: "两人煮面", l:39.5, w:29, h:22 },
  { group: "煮面/烟火系列", name: "人间烟火", l:39.5, w:29, h:22 },
  { group: "煮面/烟火系列", name: "大红箱", l:39.5, w:29, h:22 },
  { group: "煮面/烟火系列", name: "蓝色小麦箱", l:34, w:26, h:17 },
  { group: "专箱系列", name: "掂珈拉专箱-黄", l:39.5, w:27, h:16 },
  { group: "专箱系列", name: "掂珈拉专箱-蓝", l:39.5, w:27, h:16 },
  { group: "专箱系列", name: "雪莹粉", l:32.5, w:28.5, h:25.5 },
  { group: "专箱系列", name: "御用粉", l:32.5, w:28.5, h:25.5 },
  { group: "专箱系列", name: "咔司粉", l:39.5, w:27.5, h:17.5 },
  { group: "专箱系列", name: "珀晶粉", l:39.5, w:27.5, h:17.5 },
  { group: "润盛系列", name: "润盛大狮子-绿色", l:39.5, w:29, h:22 },
  { group: "润盛系列", name: "润盛小狮子-橘色", l:34, w:6.5, h:25.5 },
  { group: "润盛系列", name: "润盛小狮子-绿色", l:34, w:6.5, h:25.5 },
  { group: "迎俐系列", name: "迎俐-卡其色5kg", l:39.5, w:27.5, h:17.5 },
  { group: "迎俐系列", name: "迎俐-绿色5kg", l:39.5, w:27.5, h:17.5 },
  { group: "迎俐系列", name: "迎俐-金色10kg", l:43, w:30.5, h:17.5 },
  { group: "其他系列", name: "猪油/黄油", l:24, w:24.5, h:35 },
  { group: "原料系列", name: "面粉", l:74, w:48, h:17 },
];

// 初始化：全部为 0，不从本地存储读取
let counts = {};
boxes.forEach((_, i) => { counts[i] = 0; });

function getVol(i) {
  const b = boxes[i];
  return b.l * b.w * b.h / 1000000 * (counts[i] || 0);
}

function updateTotal() {
  let totalV = 0, totalN = 0;
  boxes.forEach((_, i) => {
    totalV += getVol(i);
    totalN += (counts[i] || 0);
  });
  document.getElementById('totalVol').textContent = totalV.toFixed(4) + ' 方';
  document.getElementById('totalBox').textContent = '共 ' + totalN + ' 箱';
}

function changeCount(i, delta) {
  counts[i] = Math.max(0, (counts[i] || 0) + delta);
  document.getElementById('inp' + i).value = counts[i];
  document.getElementById('vol' + i).textContent = getVol(i).toFixed(4) + '方';
  updateTotal();
  calcTruck();
}

function setCount(i, val) {
  counts[i] = Math.max(0, parseInt(val) || 0);
  document.getElementById('inp' + i).value = counts[i];
  document.getElementById('vol' + i).textContent = getVol(i).toFixed(4) + '方';
  updateTotal();
  calcTruck();
}

function calcTruck() {
  const L = parseFloat(document.getElementById('tL').value) || 0;
  const W = parseFloat(document.getElementById('tW').value) || 0;
  const H = parseFloat(document.getElementById('tH').value) || 0;
  let totalV = 0;
  boxes.forEach((_, i) => totalV += getVol(i));
  const truckV = L * W * H;
  const result = document.getElementById('truckResult');
  const fill = document.getElementById('progFill');
  const plabel = document.getElementById('progLabel');
  if (truckV > 0) {
    const pct = Math.min(100, (totalV / truckV * 100));
    fill.style.width = pct + '%';
    plabel.textContent = pct.toFixed(1) + '%';
    if (totalV <= truckV) {
      result.innerHTML = `车厢容积 <b>${truckV.toFixed(2)}</b> 方，货物 <b>${totalV.toFixed(4)}</b> 方，<span style="color:#2e7d32">✅ 容积足够</span>`;
    } else {
      result.innerHTML = `车厢容积 <b>${truckV.toFixed(2)}</b> 方，货物 <b>${totalV.toFixed(4)}</b> 方，<span style="color:#d32f2f">⚠️ 超出 ${(totalV-truckV).toFixed(4)} 方</span>`;
    }
  } else {
    fill.style.width = '0%';
    plabel.textContent = '0%';
    result.textContent = '';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 1800);
}

function exportSummary() {
  let lines = ['=== 装车汇总 ===', ''];
  let totalV = 0, totalN = 0;
  boxes.forEach((b, i) => {
    const n = counts[i] || 0;
    if (n > 0) {
      const v = b.l * b.w * b.h / 1000000 * n;
      totalV += v; totalN += n;
      lines.push(`${b.name} × ${n}件 = ${v.toFixed(4)}方`);
    }
  });
  if (totalN === 0) { showToast('请先输入箱型数量'); return; }
  lines.push('');
  lines.push(`合计：${totalN}箱，${totalV.toFixed(4)}方`);
  const L = document.getElementById('tL').value;
  const W = document.getElementById('tW').value;
  const H = document.getElementById('tH').value;
  if (L && W && H) {
    const tv = (parseFloat(L)*parseFloat(W)*parseFloat(H)).toFixed(2);
    lines.push(`车厢：${L}×${W}×${H}m = ${tv}方`);
  }
  const text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板！')).catch(fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = 0;
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast('✅ 已复制到剪贴板！'); }
    catch(e) { showToast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
}

function resetAll() {
  if (!confirm('确定全部清零？')) return;
  boxes.forEach((_, i) => { counts[i] = 0; });
  document.querySelectorAll('.item input[type="number"]').forEach(inp => { inp.value = 0; });
  boxes.forEach((_, i) => { document.getElementById('vol' + i).textContent = '0.0000方'; });
  updateTotal(); calcTruck();
}

function filterItems() {
  const kw = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.item').forEach(el => {
    const name = el.querySelector('.name').textContent.toLowerCase();
    el.style.display = name.includes(kw) ? '' : 'none';
  });
}

function render() {
  const groups = {};
  boxes.forEach((b, i) => {
    if (!groups[b.group]) groups[b.group] = [];
    groups[b.group].push(i);
  });
  let html = '';
  for (const [gname, items] of Object.entries(groups)) {
    html += `<div class="group" data-group="${gname}">
      <div class="group-header" onclick="toggleGroup(this)">
        <span>${gname}</span><span class="arrow">▼</span>
      </div>
      <div class="group-body">`;
    items.forEach(i => {
      const b = boxes[i];
      const sv = (b.l*b.w*b.h/1000000).toFixed(4);
      html += `<div class="item">
        <div class="name">${b.name}<br><span class="size">${b.l}×${b.w}×${b.h}cm 丨 ${sv}方/箱</span></div>
        <div class="ctrl">
          <button class="minus" onclick="changeCount(${i},-1)">−</button>
          <input type="number" id="inp${i}" value="0" min="0" onchange="setCount(${i},this.value)">
          <button class="plus" onclick="changeCount(${i},1)">+</button>
        </div>
        <div class="vol"><span class="totalv" id="vol${i}">0.0000方</span></div>
      </div>`;
    });
    html += '</div></div>';
  }
  document.getElementById('groups').innerHTML = html;
  updateTotal();
}

function toggleGroup(el) {
  el.classList.toggle('collapsed');
  const body = el.nextElementSibling;
  body.style.display = body.style.display === 'none' ? '' : 'none';
}

render();
</script>
</body>
</html>
